# Configuration for Geospatial Precipitation Downscaling Benchmark Suite
project:
  name: "downscale_curah_hujan"
  version: "1.0.0"
  description: "Automated, reproducible benchmarking pipeline for daily/monthly rainfall downscaling"

spatial:
  crs_geographic: "EPSG:4326"
  crs_projected: "EPSG:32749" # UTM Zone 49S (Southern Hemisphere, Central Java)
  target_resolution_m: 250 # Grid resolution in meters for fine spatial prediction
  buffer_safety_deg: 0.01

paths:
  dem_raw: "data/raw/dem_topografi.tif"
  boundary_geojson: "data/raw/33.05_kecamatan.geojson"
  stations_csv: "data/raw/rain_gauges_daily.csv"
  satellite_nc: "data/raw/chirps_satellite.nc"
  processed_dir: "data/processed"
  outputs_models: "outputs/models"
  outputs_rasters: "outputs/rasters"
  outputs_tables: "outputs/tables"
  outputs_figures: "outputs/figures"

preprocessing:
  vif_threshold: 5.0
  zero_rain_threshold: 0.40 # Threshold to activate two-stage classification-regression hurdle
  tpi_neighborhood_size: 5
  tpi_inner_radius_cells: 1
  tpi_outer_radius_cells: 5

validation:
  method: "spatial_block_kfold"
  n_splits: 4
  buffer_zone_enabled: true
  min_buffer_m: 5000.0 # Buffer distance in meters (5 km) to eliminate spatial leakage

models:
  rfsi:
    k_neighbors: 5
    n_estimators: 100
    random_state: 42
  spatial_xgboost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    random_state: 42
  spatial_lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    random_state: 42
  geostats:
    variogram_model: "gaussian" # spherical, exponential, gaussian
    trend_estimator: "rf"
  conditional_merging:
    variogram_model: "gaussian"

evaluation:
  metrics:
    - "KGE"
    - "RMSE"
    - "MAE"
    - "PBIAS"
    - "R2"
    - "PEARSON_R"
